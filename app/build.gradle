plugins {
    id 'com.android.application'
}

android {
    namespace "com.along.livesubtitle"
    compileSdk 34

    defaultConfig {
        applicationId "com.along.livesubtitle"
        minSdk 28
        targetSdk 34
        versionCode 2
        versionName "1.1"
        // 只打手机需要的 ABI，砍掉 x86/x86_64（省 ~70MB 解压体积）
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // APK 里带模型，关闭压缩会更好装（体积控制交给 minify 关闭 + int8 模型）
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        // 避免 assets 里的 onnx 模型被压缩
        resources {
            excludes += ['META-INF/**']
        }
    }
    androidResources {
        noCompress 'onnx', 'txt'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // ★ sherpa-onnx 内核（JitPack，自带 arm64-v8a .so，无需 NDK）
    // official prebuilt AAR from GitHub Release (JitPack v2.0.1 is a stale hand-uploaded shell)
    implementation files('libs/sherpa-onnx.aar')
}