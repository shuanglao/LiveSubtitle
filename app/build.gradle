plugins {
    id 'com.android.application'
}

android {
    namespace "com.along.livesubtitle"
    compileSdk 34

    defaultConfig {
        applicationId "com.along.livesubtitle"
        minSdk 28
        targetSdk 34
        versionCode 25
        versionName "1.14"
        // 只打手机需要的 ABI，砍掉 x86/x86_64（省 ~70MB 解压体积）
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // v1.11 第3条：AGP 8.x 默认 buildConfig=false，开启后 Lg 才能用 BuildConfig.DEBUG
    buildFeatures {
        buildConfig true
    }

    // v1.13 方案B：固定签名，保证 CI 每次产出的 APK 签名一致，可覆盖安装
    // 参数来自 gradle.properties / 命令行 -P / CI 环境变量 injected by workflow
    // 未提供 keystore 时回退 Gradle 默认 debug 签名（本地开发不受影响）
    signingConfigs {
        release {
            if (project.hasProperty('LS_STORE_FILE')) {
                storeFile file(project.property('LS_STORE_FILE'))
                storePassword project.property('LS_STORE_PASS')
                keyAlias project.property('LS_KEY_ALIAS')
                keyPassword project.property('LS_KEY_PASS')
            }
        }
    }

    buildTypes {
        debug {
            if (project.hasProperty('LS_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('LS_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // APK 里带模型，关闭压缩会更好装（体积控制交给 minify 关闭 + int8 模型）
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        // 避免 assets 里的 onnx 模型被压缩
        resources {
            excludes += ['META-INF/**']
        }
    }
    androidResources {
        noCompress 'onnx', 'txt'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // ★ sherpa-onnx 内核（JitPack，自带 arm64-v8a .so，无需 NDK）
    // official prebuilt AAR from GitHub Release (JitPack v2.0.1 is a stale hand-uploaded shell)
    implementation files('libs/sherpa-onnx.aar')
    // ★ Shizuku 客户端（借 shell 权限做电池白名单）
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}