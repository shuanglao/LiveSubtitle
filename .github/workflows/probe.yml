name: Build CapProbe APK

on:
  push:
    branches: [ probe ]
    paths:
      - 'captest/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -5 || true
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-probe-${{ runner.os }}-${{ hashFiles('captest/**/*.gradle', 'captest/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-probe-${{ runner.os }}-

      - name: Build debug APK
        working-directory: captest
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect artifact
        run: |
          mkdir -p out
          find captest -name "*.apk" -type f | while read f; do
            echo "found: $f"
            cp "$f" out/CapProbe-probe.apk
          done
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CapProbe-debug
          path: out/*.apk
          retention-days: 90