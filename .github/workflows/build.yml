name: Build LiveSubtitle APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ---------- 下载离线识别模型到 assets ----------
      - name: Download streaming zipformer model (bilingual zh-en)
        run: |
          set -e
          MODEL_NAME="sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20"
          DEST="app/src/main/assets/${MODEL_NAME}"
          mkdir -p "${DEST}"
          BASE="https://huggingface.co/csukuangfj/${MODEL_NAME}/resolve/main"
          for f in encoder-epoch-99-avg-1.int8.onnx \
                   decoder-epoch-99-avg-1.onnx \
                   joiner-epoch-99-avg-1.int8.onnx \
                   tokens.txt ; do
            echo "==> downloading $f"
            curl -L --fail --retry 3 --retry-delay 5 -o "${DEST}/$f" "${BASE}/$f"
          done
          ls -lh "${DEST}"

      # ---------- 编译 ----------
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSubtitle-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
