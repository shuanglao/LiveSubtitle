name: Build LiveSubtitle APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -5 || true
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Download sherpa-onnx AAR (official release)
        run: |
          mkdir -p app/libs
          AAR_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar"
          echo "==> downloading $AAR_URL"
          curl -L --fail --retry 5 --retry-delay 5 -C - -o app/libs/sherpa-onnx.aar "$AAR_URL"
          ls -lh app/libs/
      - name: Download streaming zipformer model
        run: |
          MODEL_NAME="sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20"
          DEST="app/src/main/assets/${MODEL_NAME}"
          mkdir -p "${DEST}"
          BASE="https://huggingface.co/csukuangfj/${MODEL_NAME}/resolve/main"
          for f in encoder-epoch-99-avg-1.int8.onnx decoder-epoch-99-avg-1.onnx joiner-epoch-99-avg-1.int8.onnx tokens.txt; do
            echo "==> downloading $f"
            curl -L --fail --retry 3 --retry-delay 5 -o "${DEST}/$f" "${BASE}/$f"
          done
          ls -lh "${DEST}"

      - name: Probe sherpa-onnx AAR class signatures
        run: |
          cd /tmp && rm -rf aarx && mkdir aarx && cd aarx
          unzip -o -q "$GITHUB_WORKSPACE/app/libs/sherpa-onnx.aar" classes.jar
          unzip -o -q classes.jar -d cls
          ls cls/com/k2fsa/sherpa/onnx/ | head -50
          for c in OnlineRecognizer OnlineRecognizerConfig OnlineModelConfig OnlineTransducerModelConfig EndpointConfig EndpointRule FeatureConfig; do
            echo "===== $c ====="
            javap -p -classpath cls com.k2fsa.sherpa.onnx.$c 2>&1 | head -60
          done
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LiveSubtitle-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
