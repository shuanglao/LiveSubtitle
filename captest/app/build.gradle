plugins {
    id 'com.android.application'
}

android {
    namespace 'com.along.capprobe'
    compileSdk 34

    defaultConfig {
        applicationId "com.along.capprobe"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "0.1"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}